[package]
name = "eon-download-manager"
description = "EON Download Manager: the window over the engine, the tray, the browser hand-off."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "eon-download-manager"
path = "src/main.rs"

# Every dependency is a supply-chain commitment (madde 37).
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eon-dm-engine = { path = "../engine" }
# The window (madde 2): the system webview. `tray-icon`: downloads keep going with
# the window closed, as people expect of a download manager.
tauri = { version = "2", features = ["tray-icon"] }
# One window per person: a second start, or the browser's hand-off, goes to it.
tauri-plugin-single-instance = "2"
# "Finished" and "failed" where the person already looks.
tauri-plugin-notification = "2"
# The folder picker, called from Rust only: the interface gets no file-system API.
tauri-plugin-dialog = "2"
# Open a finished file, show it in its folder. Rust only, as above.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading links copied to the clipboard and named in hand-offs.
url = "2"
# Watching the clipboard for download links (opt-out in settings), read from Rust
# so the interface never sees the clipboard.
arboard = { version = "3", default-features = false }
# A small runtime for --selftest's in-process test server.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
# Registering the browser hand-off (native messaging) under HKCU, on request.
winreg = "0.56"

[lints]
workspace = true
