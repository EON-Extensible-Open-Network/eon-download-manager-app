name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The engine against a real HTTP server on the runner: segmentation,
      # resume after a crash, changed files, expired links, HLS with AES-128.
      - run: cargo test
      - name: Self-test (includes a real download)
        shell: bash
        run: |
          target/debug/eon-download-manager${{ runner.os == 'Windows' && '.exe' || '' }} --selftest report.txt || { cat report.txt; exit 1; }
          cat report.txt
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "22"
      - name: Drive the real window
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/ui-check.mjs --app target/debug/eon-download-manager.exe --shots shots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: interface-screenshots
          path: shots
          if-no-files-found: ignore

  invariants:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The interface has no network of its own
        run: |
          if grep -rIn -E '\b(fetch|XMLHttpRequest|WebSocket|EventSource|importScripts)\s*\(' src | grep -vE ':[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the interface is reaching the network directly"
            exit 1
          fi
      - name: Untrusted text never becomes markup
        run: |
          if grep -rIn -E 'innerHTML|outerHTML\s*=|insertAdjacentHTML|document\.write' src extension; then
            echo "::error::markup from strings -- use textContent"
            exit 1
          fi
      - name: No telemetry (madde 36)
        run: |
          if grep -rIn -iE 'telemetry|analytics|sentry|mixpanel|posthog' src extension engine/src src-tauri/src src-tauri/Cargo.toml engine/Cargo.toml; then
            echo "::error::telemetry-shaped code found"
            exit 1
          fi
      - name: No subscription or licence code in the application (madde 44c)
        run: |
          if grep -rIn -iE 'subscription|paywall|licen[cs]e[_ -]?key|activation[_ -]?code|serial[_ -]?number|trial[_ -]?(days|period)' src extension engine/src src-tauri/src; then
            echo "::error::the application is free for individuals and carries no licensing code"
            exit 1
          fi
      - name: Only the plugins decided on
        run: |
          if grep -nE '^\s*tauri-plugin-' src-tauri/Cargo.toml | grep -vE 'tauri-plugin-(single-instance|notification|dialog|opener) '; then
            echo "::error::a tauri plugin that was not decided on"
            exit 1
          fi
      - name: The interface reaches no plugin
        run: |
          if grep -nE '"(fs|shell|http|dialog|opener|clipboard-manager|notification):' src-tauri/capabilities/*.json; then
            echo "::error::a plugin permission was granted to the interface"
            exit 1
          fi
      - name: Versions agree
        run: |
          app=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d- -f1)
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          ext=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "workspace $app, tauri $conf, extension $ext"
          test "$app" = "$conf" && test "$app" = "$ext"

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
