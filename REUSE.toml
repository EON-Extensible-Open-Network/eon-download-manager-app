version = 1
SPDX-PackageName = "eon-download-manager-app"
SPDX-PackageSupplier = "EON contributors"
SPDX-PackageDownloadLocation = "https://github.com/EON-Extensible-Open-Network/eon-download-manager-app"

# Our own files.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 EON contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Geist, by Vercel and basement.studio, under the SIL Open Font License.
[[annotations]]
path = ["src/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

# Lucide icons, collected into one sprite.
[[annotations]]
path = ["src/icons.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"
